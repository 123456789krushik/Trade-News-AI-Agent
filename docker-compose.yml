version: "3.8"

services:
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeflow-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/tradeflow.db
      - LOG_LEVEL=INFO
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data
    networks:
      - tradeflow-net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: tradeflow-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_DOMAIN:-n8n.yourdomain.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-tradeflow-secure-encryption-key-string}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - tradeflow-net

  caddy:
    image: caddy:latest
    container_name: tradeflow-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fastapi
      - n8n
    networks:
      - tradeflow-net

volumes:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  tradeflow-net:
    driver: bridge
